    <style>
      body {
        background-color: #f7faf5;
        color: #191c1a;
        -webkit-font-smoothing: antialiased;
        font-family: "Atkinson Hyperlegible Next", sans-serif;
      }
      .material-symbols-outlined {
        font-family: 'Material Symbols Outlined';
        font-weight: normal;
        font-style: normal;
        font-size: 20px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-feature-settings: 'liga';
        -webkit-font-smoothing: antialiased;
      }
      /* Zen sand rake pattern for Cairns view */
      .zen-sand-pattern {
        background-color: #E9ECE7;
        background-image: radial-gradient(#D5DAD2 0.75px, transparent 0.75px), radial-gradient(#D5DAD2 0.75px, #E9ECE7 0.75px);
        background-size: 32px 32px;
        background-position: 0 0, 16px 16px;
      }
      .stone-hover-transition {
        transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.28s cubic-bezier(0.2, 0, 0, 1);
      }
